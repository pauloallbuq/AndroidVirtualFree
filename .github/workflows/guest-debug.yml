name: Guest Debug

# Diagnóstico rápido do convidado (KVM = funcional em minutos; TCG = mesmo modo do celular)
on:
  push:
    branches: [ 'debug/**' ]
  workflow_dispatch:

env:
  ISO_URL: https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso
  ISO_NAME: android-x86_64-9.0-r2.iso

permissions:
  contents: write

defaults:
  run:
    shell: bash scripts/ci-run.sh {0}

jobs:
  guest:
    strategy:
      fail-fast: false
      matrix:
        accel: [ kvm, tcg, tcgfb ]
    name: Convidado (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Dependências
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs python3-pil
      - name: Habilitar KVM
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Cache da ISO Android-x86
        uses: actions/cache@v4
        with:
          path: ${{ env.ISO_NAME }}
          key: iso-${{ env.ISO_NAME }}
      - name: Baixar ISO
        run: |
          for i in 1 2 3 4 5; do
            [ -s "$ISO_NAME" ] && [ "$(stat -c %s "$ISO_NAME")" -gt 900000000 ] && break
            curl -fL -C - --retry 5 --retry-delay 10 -A "Wget/1.21.4" -o "$ISO_NAME" "$ISO_URL" || sleep 15
          done
          ls -la "$ISO_NAME"
      - name: Disco /data e APK de teste
        run: |
          bash scripts/make_data_disk.sh data.qcow2 16G
          gradle --no-daemon :probe:assembleDebug
      - name: Boot do convidado
        env:
          AVF_E2E_ISO: ${{ github.workspace }}/${{ env.ISO_NAME }}
          AVF_E2E_DATA: ${{ github.workspace }}/data.qcow2
          AVF_E2E_PROBE_APK: ${{ github.workspace }}/probe/build/outputs/apk/debug/probe-debug.apk
          AVF_E2E_OUT: ${{ github.workspace }}/e2e-out
          AVF_E2E_ACCEL: ${{ matrix.accel == 'kvm' && 'kvm' || 'tcg,thread=multi,tb-size=256' }}
          AVF_E2E_CMDLINE_EXTRA: ${{ matrix.accel == 'tcgfb' && 'nomodeset HWACCEL=0 vga=0x318' || '' }}
          AVF_E2E_NOREBOOT: '1'
        run: gradle --no-daemon :app:testDebugUnitTest --tests '*GuestE2ETest*'
      - name: Converter capturas
        if: always()
        run: |
          python3 -c "
          import glob
          from PIL import Image
          for f in glob.glob('e2e-out/*.ppm'):
              Image.open(f).save(f[:-4] + '.png')
          " || true
      - name: Publicar resultados na branch ci-results
        if: always()
        shell: bash
        run: |
          D=$(mktemp -d); mkdir -p "$D/$J"
          for d in e2e-out ci-logs; do [ -d "$d" ] && cp -r "$d" "$D/$J/" ; done
          find "$D" -name '*.ppm' -delete; find "$D" -name 'work' -type d -prune -exec rm -rf {} +
          for f in $(find "$D" -size +20M); do tail -c 15000000 "$f" > "$f.tail"; rm "$f"; done
          cd "$D" && git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "$J run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results:ci-results/$J-${{ github.run_id }}
        env:
          J: dbg-${{ matrix.accel }}
