name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

env:
  ISO_URL: https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso
  ISO_NAME: android-x86_64-9.0-r2.iso

permissions:
  contents: write   # publica logs/capturas na branch ci-results (legíveis sem login)

defaults:
  run:
    # toda saída também vai para ci-logs/ (as anotações de erro são lidas sem login)
    shell: bash scripts/ci-run.sh {0}

jobs:
  build:
    name: Compilar APK + testes unitários
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dependências do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf zstd qemu-utils e2fsprogs

      - name: Motor QEMU (pacotes Termux) para arm64-v8a e x86_64
        run: |
          python3 scripts/fetch_termux_qemu.py --arch aarch64 --abi arm64-v8a --jnilibs app/src/main/jniLibs --assets app/src/main/assets
          python3 scripts/fetch_termux_qemu.py --arch x86_64  --abi x86_64    --jnilibs app/src/main/jniLibs --assets app/src/main/assets
          du -sh app/src/main/jniLibs/*
          file app/src/main/jniLibs/arm64-v8a/libqemu_x86_64.so app/src/main/jniLibs/x86_64/libqemu_x86_64.so

      - name: Disco persistente /data do convidado
        run: bash scripts/make_data_disk.sh app/src/main/assets/vm/data.qcow2 16G

      - name: Testes unitários
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar APKs de debug
        run: gradle --no-daemon :app:assembleDebug :probe:assembleDebug

      - name: Verificar APK gerado
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/libqemu_x86_64.so"
          unzip -l "$APK" | grep -E "assets/vm/data.qcow2"
          unzip -l "$APK" | grep -E "assets/qemu/bios-256k.bin"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidVirtualFree-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-inputs
          path: |
            probe/build/outputs/apk/debug/probe-debug.apk
            app/src/main/assets/vm/data.qcow2
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Publicar resultados na branch ci-results
        if: always()
        shell: bash
        run: |
          D=$(mktemp -d); mkdir -p "$D/$J"
          for d in e2e-out device-out ci-logs; do [ -d "$d" ] && cp -r "$d" "$D/$J/" ; done
          find "$D" -name '*.ppm' -delete; find "$D" -name 'work' -type d -prune -exec rm -rf {} +
          find "$D" -size +20M -delete
          cd "$D" && git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "$J run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results:ci-results/$J-${{ github.run_id }}
        env:
          J: build
      - name: Relatar erro (anotações)
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in ci-logs/steps.log e2e-out/report.txt device-out/report.txt; do
            [ -f "$f" ] || continue
            tail -n 120 "$f" | sed 's/%/%25/g' | split -l 12 - /tmp/chunk_
            for c in /tmp/chunk_*; do echo "::error title=$f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$c")"; done
            rm -f /tmp/chunk_*
          done

  guest-e2e:
    strategy:
      fail-fast: false
      matrix:
        accel: [ kvm, tcg ]
    name: Convidado real ${{ matrix.accel }} (boot, instalar APK, root, persistência)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: QEMU do host
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 python3-pil && qemu-system-x86_64 --version
      - name: Habilitar KVM
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with: { name: e2e-inputs, path: e2e-inputs }
      - name: Cache da ISO Android-x86
        uses: actions/cache@v4
        with:
          path: ${{ env.ISO_NAME }}
          key: iso-${{ env.ISO_NAME }}
      - name: Baixar ISO Android-x86 9.0-r2
        run: |
          for i in 1 2 3 4 5 6; do
            [ -s "$ISO_NAME" ] && [ "$(stat -c %s "$ISO_NAME")" -gt 900000000 ] && break
            curl -fL -C - --retry 5 --retry-delay 10 -A "Wget/1.21.4" -o "$ISO_NAME" "$ISO_URL" || sleep 20
          done
          ls -la "$ISO_NAME"; sha256sum "$ISO_NAME"
      - name: Teste ponta-a-ponta (TCG, sem KVM — mesmo modo do celular)
        env:
          AVF_E2E_ISO: ${{ github.workspace }}/${{ env.ISO_NAME }}
          AVF_E2E_DATA: ${{ github.workspace }}/e2e-inputs/app/src/main/assets/vm/data.qcow2
          AVF_E2E_PROBE_APK: ${{ github.workspace }}/e2e-inputs/probe/build/outputs/apk/debug/probe-debug.apk
          AVF_E2E_OUT: ${{ github.workspace }}/e2e-out
          AVF_E2E_ACCEL: ${{ matrix.accel == 'kvm' && 'kvm' || 'tcg,thread=multi,tb-size=256' }}
        run: |
          mkdir -p app/src/main/assets/vm && cp "$AVF_E2E_DATA" app/src/main/assets/vm/data.qcow2
          gradle --no-daemon :app:testDebugUnitTest --tests '*GuestE2ETest*'
      - name: Converter capturas de tela
        if: always()
        run: |
          python3 -c "
          import glob
          from PIL import Image
          for f in glob.glob('e2e-out/*.ppm'):
              Image.open(f).save(f[:-4] + '.png'); print(f)
          " || true
          cat e2e-out/report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-e2e-results-${{ matrix.accel }}
          path: |
            e2e-out/*.png
            e2e-out/*.txt
            e2e-out/*.log

      - name: Publicar resultados na branch ci-results
        if: always()
        shell: bash
        run: |
          D=$(mktemp -d); mkdir -p "$D/$J"
          for d in e2e-out device-out ci-logs; do [ -d "$d" ] && cp -r "$d" "$D/$J/" ; done
          find "$D" -name '*.ppm' -delete; find "$D" -name 'work' -type d -prune -exec rm -rf {} +
          find "$D" -size +20M -delete
          cd "$D" && git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "$J run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results:ci-results/$J-${{ github.run_id }}
        env:
          J: guest-${{ matrix.accel }}
      - name: Relatar erro (anotações)
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in ci-logs/steps.log e2e-out/report.txt device-out/report.txt; do
            [ -f "$f" ] || continue
            tail -n 120 "$f" | sed 's/%/%25/g' | split -l 12 - /tmp/chunk_
            for c in /tmp/chunk_*; do echo "::error title=$f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$c")"; done
            rm -f /tmp/chunk_*
          done

  device-test:
    name: App no emulador Android (exec do QEMU sem root)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: AndroidVirtualFree-debug-apk, path: apk }
      - name: Cache da ISO Android-x86
        uses: actions/cache@v4
        with:
          path: ${{ env.ISO_NAME }}
          key: iso-${{ env.ISO_NAME }}
      - name: Baixar ISO Android-x86 9.0-r2
        run: |
          for i in 1 2 3 4 5 6; do
            [ -s "$ISO_NAME" ] && [ "$(stat -c %s "$ISO_NAME")" -gt 900000000 ] && break
            curl -fL -C - --retry 5 --retry-delay 10 -A "Wget/1.21.4" -o "$ISO_NAME" "$ISO_URL" || sleep 20
          done
          ls -la "$ISO_NAME"; sha256sum "$ISO_NAME"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador API 34 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/device_test.sh apk/app-debug.apk ${{ env.ISO_NAME }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: device-out/

      - name: Publicar resultados na branch ci-results
        if: always()
        shell: bash
        run: |
          D=$(mktemp -d); mkdir -p "$D/$J"
          for d in e2e-out device-out ci-logs; do [ -d "$d" ] && cp -r "$d" "$D/$J/" ; done
          find "$D" -name '*.ppm' -delete; find "$D" -name 'work' -type d -prune -exec rm -rf {} +
          find "$D" -size +20M -delete
          cd "$D" && git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "$J run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results:ci-results/$J-${{ github.run_id }}
        env:
          J: device
      - name: Relatar erro (anotações)
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in ci-logs/steps.log e2e-out/report.txt device-out/report.txt; do
            [ -f "$f" ] || continue
            tail -n 120 "$f" | sed 's/%/%25/g' | split -l 12 - /tmp/chunk_
            for c in /tmp/chunk_*; do echo "::error title=$f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$c")"; done
            rm -f /tmp/chunk_*
          done
